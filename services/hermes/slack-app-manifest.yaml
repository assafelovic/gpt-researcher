# Slack app manifest for the HLT Hermes brain.
# Create the app at https://api.slack.com/apps → "Create New App" →
# "From an app manifest" → pick the HLT workspace → paste this file.
display_information:
  name: Mastery Brain
  description: HLT estate brain — ask about the codebase, research, roadmap.
  background_color: "#1a1a2e"
features:
  bot_user:
    display_name: mastery-brain
    always_online: true
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - groups:history
      - groups:read
      - im:history
      - im:read
      - im:write
      - mpim:history
      - mpim:read
      - reactions:read
      - reactions:write
      - users:read
      - files:read
      - files:write
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
