# Railway deploy config for gpt-researcher (HLT internal service)
#
# This file tells Railway explicitly how to build + run the GPT Researcher
# FastAPI service. Without it Railway would still pick up the Procfile + Python
# defaults, but being explicit avoids version drift and makes the deploy
# reproducible.
#
# Entry point: `./railway-start.sh` dispatches API vs MCP by service env.
# API target: `backend.server.app:app` (FastAPI, lifespan-enabled).
# MCP target: `mcp_server.server:app` (streamable HTTP at /mcp).
# `main.py` also wraps uvicorn for local dev (`python main.py` listens on 8000).
#
# Env vars required at deploy time:
#   OPENAI_API_KEY   — OpenAI key used by the research agents
#   TAVILY_API_KEY   — primary web-search backend
#   API_AUTH_KEY     — required by the API deploy script for REST/WebSocket auth
#   MCP_AUTH_TOKEN   — required by the MCP deploy script for Bearer auth
#   PORT             — injected by Railway automatically
#
# Optional:
#   DOC_PATH         — only needed if you use the /upload document flow
#   RESEARCH_RUN_STORE_PATH — SQLite run metadata path; use a Railway volume
#   OUTPUTS_DIR      — generated report/log directory; use the same volume
#   RAILWAY_RUN_UID  — set to 0 when writing Railway volumes from this Dockerfile
#
# Health: GET /health returns a JSON liveness probe (installed via
# `backend/server/hlt_extensions.py`). GET / still works (returns the
# frontend HTML) but is heavier and brittle.

[build]
builder = "NIXPACKS"

[deploy]
# Procfile and Dockerfile CMD both use `railway-start.sh` so either Railway
# builder path dispatches correctly for API vs MCP.
# This restartPolicy matches Railway's default but made explicit so behavior
# doesn't drift silently if Railway changes defaults.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Health check — Railway will retry this URL until 2xx before routing traffic.
healthcheckPath = "/health"
healthcheckTimeout = 300
