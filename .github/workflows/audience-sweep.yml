name: Weekly audience sweep

# Runs a deep audience-scoped research sweep against the hosted researcher,
# refreshes the nursingmastery.com content inventory, and opens a PR adding
# the distilled brief to my-docs/audience/. A human merges; merged docs become
# research context on the next deploy.

on:
  schedule:
    - cron: "0 11 * * 1" # Mondays 11:00 UTC (~6am CT)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Run audience research sweep
        id: sweep
        env:
          RESEARCHER_URL: ${{ vars.RESEARCHER_URL || 'https://gpt-researcher-api-production.up.railway.app' }}
          API_AUTH_KEY: ${{ secrets.API_AUTH_KEY }}
        run: |
          set -euo pipefail
          TASK="Weekly audience sweep: What are nurses and nursing students saying this week? \
          Rank the top pain points and trending topics by engagement (upvotes, replies) across \
          r/nursing, r/StudentNurse, and allnurses.com. Quote nurses verbatim with links and \
          signal counts. Compare against the internal audience corpus and call out what is NEW \
          or GROWING versus what the corpus already captures. End with recommended moves and \
          which nursingmastery.com pages they affect."

          jq -n --arg task "$TASK" '{
            task: $task,
            report_type: "research_report",
            report_source: "hybrid",
            tone: "Objective",
            generate_in_background: false,
            hlt_research_scope: {audience: true, firecrawl: true, depth: "deep"}
          }' > payload.json

          curl --fail-with-body -sS -X POST "$RESEARCHER_URL/report/" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: $API_AUTH_KEY" \
            --max-time 2400 \
            -d @payload.json > response.json

          python3 - <<'PY'
          import datetime
          import json
          import pathlib

          response = json.load(open("response.json"))
          report = response.get("report") or ""
          if len(report.strip()) < 200:
              raise SystemExit(f"Report too short to be useful: {report[:200]!r}")

          today = datetime.date.today().isoformat()
          path = pathlib.Path(f"my-docs/audience/brief-{today}.md")
          path.write_text(
              f"# Audience brief — {today} (weekly sweep)\n\n"
              "Generated by the audience-sweep workflow. Review before merging; "
              "delete anything that reads like filler.\n\n---\n\n" + report,
              encoding="utf-8",
          )
          print(f"wrote {path}")
          PY
          rm -f payload.json response.json

      - name: Refresh nursingmastery.com content inventory
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          if [ -n "$FIRECRAWL_API_KEY" ]; then
            python3 scripts/build_recruiting_inventory.py || echo "inventory refresh failed (keeping previous)"
          else
            echo "FIRECRAWL_API_KEY secret not set; skipping inventory refresh"
          fi

      - name: Open PR with the distilled brief
        uses: peter-evans/create-pull-request@v6
        with:
          branch: audience-sweep/${{ github.run_id }}
          commit-message: "docs(audience): weekly sweep brief + inventory refresh"
          title: "Weekly audience sweep — ${{ github.run_id }}"
          body: |
            Automated weekly audience sweep.

            - New brief under `my-docs/audience/`
            - Refreshed `my-docs/recruiting/content-inventory.md` (when Firecrawl key present)

            Review the brief for filler before merging; merged docs become
            research context on the next deploy.
          add-paths: |
            my-docs/audience/
            my-docs/recruiting/
